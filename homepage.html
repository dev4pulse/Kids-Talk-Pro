<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kids Talk Pro – Recent Experts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
</head>
<body class="bg-gradient-to-r from-blue-100 to-green-100 font-sans min-h-screen flex items-start p-4">
  <div class="bg-white rounded-2xl shadow-lg w-full max-w-xl mx-auto mt-6 p-6">
    <!-- Header -->
    <header class="text-center mb-6">
      <h1 class="text-2xl font-bold text-green-600">Recent Experts</h1>
      <p class="text-gray-600 text-sm">Tap a subject to see the latest post</p>
    </header>

    <!-- Subject cards -->
    <div class="space-y-4">
      <div data-subject="math" class="subject p-4 bg-gray-100 rounded-lg hover:bg-gray-200 cursor-pointer">
        <h2 class="font-semibold text-lg mb-2 text-center">Math</h2>
        <div class="message-list"></div>
      </div>
      <div data-subject="ela" class="subject p-4 bg-gray-100 rounded-lg hover:bg-gray-200 cursor-pointer">
        <h2 class="font-semibold text-lg mb-2 text-center">ELA</h2>
        <div class="message-list"></div>
      </div>
    </div>

    <!-- Message input (hidden until a subject is tapped) -->
    <div id="inputArea" class="mt-6 hidden flex space-x-2">
      <input
        id="msgIn"
        type="text"
        placeholder="Type your message…"
        class="flex-1 border rounded-full px-4 py-2 focus:outline-none"
      />
      <button id="sendBtn" class="bg-green-500 hover:bg-green-600 text-white rounded-full px-4 py-2">
        Send
      </button>
    </div>

    <!-- Back to login -->
    <div class="text-center mt-6">
      <a href="login.html" class="text-blue-500 hover:underline">← Back to Login</a>
    </div>

    <!-- Footer -->
    <footer class="text-center text-gray-500 text-xs mt-6">
      &copy; <span id="year"></span> Kids Talk Pro
    </footer>
  </div>

  <script>
    // Sample expert posts
    const data = {
      math: [{ sender: "Dr. Ishan", msg: "Just solved a calculus problem!", time: "10:30 AM" }],
      ela: [{ sender: "Prof. Hari", msg: "Reviewed a poem today!", time: "Yesterday" }]
    };

    // Setup year
    document.getElementById("year").textContent = new Date().getFullYear();

    let selected = null;
    const inputArea = document.getElementById("inputArea");
    const msgIn = document.getElementById("msgIn");
    const sendBtn = document.getElementById("sendBtn");

    // Render the most recent post into a subject's .message-list
    function render(subject) {
      const list = document.querySelector(`[data-subject="${subject}"] .message-list`);
      list.innerHTML = "";
      const { sender, msg, time } = data[subject][0];
      list.innerHTML = `
        <div class="flex items-center space-x-3">
          <div class="w-8 h-8 bg-gray-300 rounded-full flex items-center justify-center text-white font-bold">${sender.charAt(0)}</div>
          <div class="flex-1 min-w-0">
            <p class="font-medium text-gray-800 truncate">${sender}</p>
            <p class="text-gray-600 text-sm truncate">${msg}</p>
          </div>
          <p class="text-gray-500 text-xs">${time}</p>
        </div>`;
    }

    // Initialize lists
    ["math","ela"].forEach(subj => render(subj));

    // Subject click handler
    document.querySelectorAll(".subject").forEach(div => {
      div.addEventListener("click", ()=>{
        selected = div.dataset.subject;
        inputArea.classList.remove("hidden");
        document.querySelectorAll(".subject").forEach(d=>d.classList.remove("bg-green-50"));
        div.classList.add("bg-green-50");
      });
    });

    // Send new post
    sendBtn.addEventListener("click", ()=>{
      const txt = msgIn.value.trim();
      if(!txt||!selected) return;
      data[selected].unshift({
        sender: "You",
        msg: txt,
        time: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})
      });
      render(selected);
      msgIn.value="";
    });
  </script>
</body>
</html>
