<!-- homepage.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kids Talk Pro - Home</title>
  <!-- Vue.js CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="homepage-app" class="min-h-screen bg-gray-100 p-6">
    <!-- Navigation -->
    <nav class="flex justify-between items-center mb-8 bg-white p-4 rounded shadow">
      <div class="text-2xl font-bold">Kids Talk Pro</div>
      <ul class="flex space-x-4">
        <li><a href="#" class="hover:text-blue-600">Home</a></li>
        <li><a href="#teachers" class="hover:text-blue-600">Teachers</a></li>
        <li><a href="#contact" class="hover:text-blue-600">Contact</a></li>
      </ul>
      <button @click="goToLogout" class="px-4 py-2 bg-blue-600 text-white rounded">Logout</button>
    </nav>

    <!-- Teachers List -->
    <section id="teachers" class="bg-white p-6 rounded shadow">
      <h2 class="text-3xl font-semibold mb-4">Our Teachers</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div v-for="(teacher, idx) in teachers" :key="idx" class="border p-4 rounded hover:shadow-lg transition">
          <h3 class="text-xl font-bold mb-1">{{ teacher.name }}</h3>
          <p class="text-gray-600 mb-3">Subject: {{ teacher.subject }}</p>
          <button @click="openChat(teacher)" class="px-4 py-2 bg-green-500 text-white rounded">Chat</button>
        </div>
      </div>
    </section>

    <!-- Chat Modal -->
    <div v-if="chatOpen" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
      <div class="bg-white w-full max-w-md rounded shadow-lg p-4">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-xl font-bold">Chat with {{ currentTeacher.name }}</h3>
          <button @click="closeChat" class="text-gray-500 hover:text-gray-800">✕</button>
        </div>
        <div class="h-64 overflow-y-auto border p-2 mb-4">
          <div v-for="(msg, idx) in messages" :key="idx" class="mb-2">
            <span :class="{'font-bold': msg.from === 'Teacher'}">{{ msg.from }}:</span> {{ msg.text }}
          </div>
        </div>
        <div class="flex">
          <input v-model="newMessage" @keyup.enter="sendMessage" type="text" placeholder="Type a message..." class="flex-1 border rounded-l px-2 py-1" />
          <button @click="sendMessage" class="px-4 bg-blue-600 text-white rounded-r">Send</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Vue App Script -->
  <script>
    const { createApp } = Vue;
    createApp({
      data() {
        return {
          teachers: [
            { name: 'Alice Johnson', subject: 'Mathematics' },
            { name: 'Brian Smith', subject: 'English' },
            { name: 'Clara Lee', subject: 'Science' },
            { name: 'David Patel', subject: 'History' },
            { name: 'Eva Wong', subject: 'Art' }
          ],
          chatOpen: false,
          currentTeacher: null,
          messages: [],
          newMessage: ''
        };
      },
      methods: {
        openChat(teacher) {
          this.currentTeacher = teacher;
          this.chatOpen = true;
          this.messages = [
            { from: teacher.name, text: `Hello! How can I help you with ${teacher.subject}?` }
          ];
        },
        closeChat() {
          this.chatOpen = false;
          this.newMessage = '';
        },
        sendMessage() {
          if (!this.newMessage.trim()) return;
          this.messages.push({ from: 'You', text: this.newMessage });
          // Simulate teacher reply
          setTimeout(() => {
            this.messages.push({ from: this.currentTeacher.name, text: 'Thanks for your message! I will get back to you shortly.' });
          }, 1000);
          this.newMessage = '';
          this.$nextTick(() => {
            const container = this.$el.querySelector('.overflow-y-auto');
            container.scrollTop = container.scrollHeight;
          });
        },
        goToLogout() {
          window.location.href = 'learner.html';
        }
      }
    }).mount('#homepage-app');
  </script>
</body>
</html>
