<!-- selection.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kids Talk Pro – Choose</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
   <style>
    .button-select {
      padding: 0.8rem 2rem;
      border-radius: 0.75rem;
      font-size: 1.1rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.3s;
      margin: 0.5rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 150px;
      color: white;
      text-decoration: none;
    }
    .button-select.expert  { background-color: #ec4899; }
    .button-select.expert:hover  { background-color: #db2777; }
    .button-select.learner { background-color: #3b82f6; }
    .button-select.learner:hover { background-color: #2563eb; }
  </style>
</head>
<body class="bg-blue-50 min-h-screen flex items-center justify-center p-4">
  <main class="bg-white p-8 rounded-2xl shadow-lg text-center max-w-sm w-full relative">
    <!-- star-in-gradient-circle graphic -->
    <div class="inline-block p-4 bg-gradient-to-r from-blue-500 to-purple-500 rounded-full mb-4 shadow-md mx-auto">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="yellow" stroke="white" stroke-width="2" class="h-12 w-12">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87L8.91 8.26 12 2z"/>
      </svg>
    </div>

    <h1 class="text-2xl font-bold mb-4">Kids <span class="text-blue-500">Talk</span> <span class="text-green-500">Pro</span></h1>
    <p class="mb-6">Welcome back! Let's have some fun!</p>
    <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
  <a
    href="learner-signup.html"
    class="block w-full sm:w-48 text-center py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-sm transition-shadow"
  >
    I’m a Learner
  </a>
  <a
    href="expert-signup.html"
    class="block w-full sm:w-48 text-center py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-sm transition-shadow"
  >
    I’m an Expert
  </a>
</div>


  </main>
</body>
</html>
