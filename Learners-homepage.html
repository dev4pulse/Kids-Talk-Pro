<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kids Talk Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Nunito', sans-serif;
    }
    .login-container {
        background-color: #ffffff;
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        padding: 20px;
        max-width: 400px;
        width: 95%;
        margin-top: 50px;
    }
    .login-header {
        text-align: center;
        margin-bottom: 20px;
    }
    .login-header h2 {
        color: #25d366;
        font-size: 1.8rem;
        font-weight: 600;
    }
    .form-group {
        margin-bottom: 15px;
    }
    .form-group label {
        display: block;
        font-size: 0.9rem;
        color: #555;
        margin-bottom: 5px;
    }
    .form-control {
        width: 100%;
        padding: 10px;
        border: 1px solid #e0e0e0;
        border-radius: 24px;
        font-size: 1rem;
        transition: border-color 0.3s ease;
    }
    .form-control:focus {
        outline: none;
        border-color: #25d366;
        box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.1);
    }
    .login-button {
        background-color: #25d366;
        color: white;
        padding: 10px 20px;
        border-radius: 24px;
        font-size: 1rem;
        font-weight: 600;
        width: 100%;
        border: none;
        cursor: pointer;
        transition: background-color 0.3s ease;
        margin-top: 10px;
    }
    .login-button:hover {
        background-color: #128c7e;
    }
    .signup-link {
        text-align: center;
        margin-top: 15px;
        font-size: 0.9rem;
    }
    .signup-link a {
        color: #25d366;
        text-decoration: none;
        font-weight: 600;
    }
    .signup-link a:hover {
        text-decoration: underline;
    }
    </style>
</head>
<body class="bg-gradient-to-r from-blue-100 to-green-100 flex justify-center align-items-center min-h-screen">
    <div class="login-container">
        <div class="login-header">
            <h2>Login to Kids Talk Pro</h2>
        </div>
        <form>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password">
            </div>
            <button type="submit" class="login-button">Login</button>
        </form>
        <div class="signup-link">
            <p>Don't have an account? <a href="signup.html">Sign up</a></p>
        </div>
    </div>
</body>
</html>
