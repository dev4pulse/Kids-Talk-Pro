<!-- learner.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kids Talk Pro – Learner Sign-Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
</head>
<body class="bg-blue-50 min-h-screen flex items-center justify-center p-4">
  <main class="bg-white p-8 rounded-2xl shadow-lg max-w-sm w-full text-center">
    <!-- same graphic -->
    <div class="inline-block p-4 bg-gradient-to-r from-blue-500 to-purple-500 rounded-full mb-4 shadow-md mx-auto">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="yellow" stroke="white" stroke-width="2" class="h-12 w-12">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87L8.91 8.26 12 2z"/>
      </svg>
    </div>

    <h2 class="text-xl font-semibold mb-4">Learner Login</h2>
    <form action="homepage.html" method="get" class="space-y-4 text-left">
      <div>
        <label class="block text-sm font-medium"name>Email</label>
        <input name="email" type="email" required class="mt-1 w-full border rounded px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-medium">Password</label>
        <input name="password" type="password" required class="mt-1 w-full border rounded px-3 py-2" />
      </div>
      <button type="submit" class="w-full py-2 bg-green-500 text-white rounded hover:bg-green-600">Login</button>
    </form>
    <p class="mt-4 text-sm text-gray-600">Don't have an account?
      <a href="learner-signup.html" class="text-blue-500 hover:underline">
        Sign up here
      </a>
    </p>
    <p class="mt-4 text-sm">
      <a href="selection.html" class="text-blue-500 hover:underline">← Back</a>
    </p>
  </main>
</body>
</html>
