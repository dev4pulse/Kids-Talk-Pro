<body class="bg-gradient-to-r from-blue-100 to-green-100">
    <div class="container">
        <header class="header">
            <h1>Recent Topics</h1>
            <p>Explore recent activities in different subjects.</p>
        </header>
        <main>
            <div class="subject-group" data-subject="math">
                <h2>Math</h2>
                <div class="message-list math-messages">
                </div>
            </div>
            <div class="subject-group" data-subject="ela">
                <h2>ELA</h2>
                <div class="message-list ela-messages">
                </div>
            </div>
            <div class="input-container" id="messageInputContainer">
                <input type="text" id="messageInput" class="text-input" placeholder="Type your message...">
                <button id="sendMessageButton" class="send-button">Send</button>
            </div>
        </main>
        <div class="button-container">
            <a href="login.html" class="back-button">Go back to Login</a>
        </div>
        <footer class="footer">
            <p>&copy; <?php echo date("Y"); ?> Kids Talk Pro. All rights reserved.</p>
        </footer>
    </div>
    <script>
        const mathMessagesData = [
            { sender: "Kid 1", message: "Solved a tricky equation!", time: "10:30 AM", avatar: "K1" },
            { sender: "Kid 2", message: "Learned about fractions.", time: "Yesterday", avatar: "K2" },
        ];
        const elaMessagesData = [
            { sender: "Kid 3", message: "Wrote a poem today!", time: "2 days ago", avatar: "K3" },
            { sender: "Kid 4", message: "Read a new book.", time: "5 days ago", avatar: "K4" },
        ];
        function createMessageItem(item) {
            const messageItem = document.createElement("div");
            messageItem.className = "message-item";
            const avatarDiv = document.createElement("div");
            avatarDiv.className = "avatar";
             if(item.avatar.startsWith("http")){
                avatarDiv.innerHTML = `<img src="${item.avatar}" alt="${item.sender}"/>`
             }
             else{
                avatarDiv.textContent = item.avatar;
             }
            const messageContentDiv = document.createElement("div");
            messageContentDiv.className = "message-content";
            const senderNameP = document.createElement("p");
            senderNameP.className = "sender-name";
            senderNameP.textContent = item.sender;
            const messageTextP = document.createElement("p");
            messageTextP.className = "message-text";
            messageTextP.textContent = item.message;
            messageContentDiv.appendChild(senderNameP);
            messageContentDiv.appendChild(messageTextP);
            const messageTimeP = document.createElement("p");
            messageTimeP.className = "message-time";
            messageTimeP.textContent = item.time;
            messageItem.appendChild(avatarDiv);
            messageItem.appendChild(messageContentDiv);
            messageItem.appendChild(messageTimeP);
            return messageItem;
        }
        const mathMessagesContainer = document.querySelector(".math-messages");
        const elaMessagesContainer = document.querySelector(".ela-messages");
        function displayMostRecentMessage(subject, messagesContainer, messages) {
            messagesContainer.innerHTML = '';
            if (messages && messages.length > 0) {
                const mostRecentMessage = messages[0];
                const messageItem = createMessageItem(mostRecentMessage);
                messagesContainer.appendChild(messageItem);
            }
        }
        displayMostRecentMessage("math", mathMessagesContainer, mathMessagesData);
        displayMostRecentMessage("ela", elaMessagesContainer, elaMessagesData);
        // Get the input element and the send button
        const messageInput = document.getElementById("messageInput");
        const sendMessageButton = document.getElementById("sendMessageButton");
        const messageInputContainer = document.getElementById("messageInputContainer");
        let selectedSubject = null;
        // Add an event listener to the send button
        sendMessageButton.addEventListener("click", () => {
            // Get the text from the input
            const messageText = messageInput.value;
            // Check if the message is not empty
            if (messageText.trim() !== "" && selectedSubject) {
                // Create a new message item
                const newMessage = {
                    sender: "You",
                    message: messageText,
                    time: "Just now",
                    avatar: "You",
                };
                if (selectedSubject === "math") {
                    mathMessagesData.unshift(newMessage);
                     displayMostRecentMessage("math", mathMessagesContainer, mathMessagesData);
                } else if (selectedSubject === "ela") {
                    elaMessagesData.unshift(newMessage);
                    displayMostRecentMessage("ela", elaMessagesContainer, elaMessagesData);
                }
                // Clear the input
                messageInput.value = "";
            }
        });
        // Add click event listeners to the subject groups
        document.querySelectorAll('.subject-group').forEach(group => {
            group.addEventListener('click', () => {
                const subject = group.dataset.subject;
                selectedSubject = subject;
                messageInputContainer.style.display = 'flex';
                // Remove selected class from all groups
                document.querySelectorAll('.subject-group').forEach(g => g.classList.remove('selected'));
                // Add selected class to the clicked group
                group.classList.add('selected');
            });
        });
    </script>
