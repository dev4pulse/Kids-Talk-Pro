<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kids Talk Pro – Expert Sign-Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
</head>
<body class="bg-blue-50 min-h-screen flex items-center justify-center p-4">
  <main class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full text-center">
    <!-- star-in-gradient-circle graphic -->
    <div class="inline-block p-4 bg-gradient-to-r from-blue-500 to-purple-500 rounded-full mb-4 shadow-md mx-auto">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="yellow" stroke="white" stroke-width="2" class="h-12 w-12">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87L8.91 8.26 12 2z"/>
      </svg>
    </div>

    <h2 class="text-xl font-semibold mb-4">Expert Sign-Up</h2>
    <form action="/api/experts/signup" method="POST" class="space-y-4 text-left">
      
      <div>
        <label for="name" class="block text-sm font-medium mb-1">Name<span class="text-red-500">*</span></label>
        <input id="name" name="name" type="text" required placeholder="Your name" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
      </div>

      <div>
        <label for="email" class="block text-sm font-medium mb-1">Email<span class="text-red-500">*</span></label>
        <input id="email" name="email" type="email" required placeholder="you@example.com" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium mb-1">Password<span class="text-red-500">*</span></label>
        <input id="password" name="password" type="password" required placeholder="••••••••" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
      </div>

      <div>
        <label for="expertise" class="block text-sm font-medium mb-1">Expertise</label>
        <input
          id="expertise"
          name="expertise"
          type="text"
          placeholder="e.g. Nutrition, Physics..."
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <div>
        <label for="experience_years" class="block text-sm font-medium mb-1">Years of Experience</label>
        <input
          id="experience_years"
          name="experience_years"
          type="number"
          min="0"
          placeholder="e.g. 5"
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <div>
        <label for="bio" class="block text-sm font-medium mb-1">Short Bio</label>
        <textarea
          id="bio"
          name="bio"
          rows="4"
          placeholder="Tell us a bit about yourself..."
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
        ></textarea>
      </div>

      <button
        type="submit"
        class="w-full py-2 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg transition-shadow shadow-sm hover:shadow-md"
      >
        Sign Up
      </button>
    </form>


  <script>
  document.getElementById('expertForm').addEventListener('submit', function(e) {
  const pw  = this.password.value;
  const cpw = this.confirmPassword.value;
  if (pw.length < 8) {
    e.preventDefault();
    alert('Password must be at least 8 characters');
    return;
  }
  if (pw !== cpw) {
    e.preventDefault();
    alert('Passwords do not match');
  }
});
  </script>


<p class="mt-4 text-sm text-gray-600">
  Already have an account?
      <a href="expert.html" class="text-blue-500 hover:underline">Login here</a>
    </p>
    <p class="mt-2 text-sm">
      <a href="selection.html" class="text-blue-500 hover:underline">← Back to Choose</a>
    </p>
  </main>
</body>
</html>
